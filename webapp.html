<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Восстановленный чат</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      color: #fff;
    
      background-image: url("/static/bg.jpg");
      background-repeat: repeat-y;   /* ⬅ повтор по вертикали */
      background-size: auto;         /* ⬅ НЕ растягиваем */
      background-position: top center;
    }
    #chat { padding:12px }
    .msg {
      margin:10px; /*УМЕНЬШИТЬ ОТСТУП МЕЖДУ СООБЩЕНИЯМ */
      padding:12px;/*УМЕНЬШИТЬ РАЗМЕР КВАДРАТА ПО ВЫСОТЕ, ЕСЛИ ПИШЕМ ДВА ЗНАЧЕНИЯ ЗНАЧИТ ПЕРВАЯ СВЕРХУ СНИХУ, А ВТОРАЯ СЛЕВА СПРАВА*/
      border-radius:14px;
      max-width:70%; /*УМЕНЬШИТЬ ПО ШИРИНЕ */
      font-size:28px;   /* ← ТЕКСТ СООБЩЕНИЙ */
      line-height:1.4;
    }
    .me { background:#2b5278; margin-left:auto; text-align:right }
    .other { background:#1e1e1e }
    .name {
      font-size:30px;   /* ← ИМЯ */
      font-weight:600;
      opacity:.85;
      margin-bottom:6px;
    }
    .time {
      font-size:16px;   /* ← ВРЕМЯ */
      opacity:.5;
      margin-top:6px;
    }
    .media {
      color:#5cc8ff;
      font-weight:bold;
      font-size:28px;   /* ← МЕДИА */
    }
  </style>
</head>

<body>
<h2 style="
  text-align:center;
  font-size:35px;
  padding:20px 0;
">
  📂 Восстановленный чат
</h2>
<div id="chat">Загрузка…</div>

<script>
async function loadChat(retry = 0) {
  const params = new URLSearchParams(window.location.search);
  const chatId = params.get("chat_id");

  try {
    const r = await fetch(`/api/chat?chat_id=${chatId}`);
    const d = await r.json();

    if (!d.ok) {
      if (retry < 5) {
        setTimeout(() => loadChat(retry + 1), 300);
        return;
      }
      chatEl.innerHTML = "❌ Чат не найден";
      return;
    }

    chatEl.innerHTML = "";

    d.messages.forEach(m => {
      const isMine = m.is_owner === true;
      let html = `
        <div class="msg ${isMine ? "me" : "other"}">
          <div class="name">${m.name || ""}</div>
      `;

      if (m.type === "text") {
        html += `<div>${m.text || ""}</div>`;
      } else if (m.file_id) {
        html += `
          <a class="media" href="/api/file?file_id=${m.file_id}" target="_blank">
            📎 ${m.type}
          </a>
        `;
      }

      html += `<div class="time">${new Date(m.time).toLocaleString()}</div></div>`;
      chatEl.insertAdjacentHTML("beforeend", html);
    });

  } catch (e) {
    chatEl.innerHTML = "❌ Ошибка сети";
  }
}

loadChat();
</script>
</body>
</html>
